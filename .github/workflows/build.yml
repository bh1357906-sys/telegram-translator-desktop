name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 语法检查 + 单元测试
        shell: bash
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
          node --test
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: tg-translator-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      # 自动更新需要 latest.yml 和 .blockmap 一起上传到 Release
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
